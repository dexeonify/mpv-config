g-p         script-binding select/select-playlist           #! Select > Playlist
g-c         script-binding select/select-chapter            #! Select > Chapter
g-e         script-binding select/select-edition            #! Select > Edition
g-t         script-binding select/select-track              #! Select > Track
g-v         script-binding select/select-vid                #! Select > Video track
g-a         script-binding select/select-aid                #! Select > Audio track
g-s         script-binding select/select-sid                #! Select > Subtitle track
g-S         script-binding select/select-secondary-sid      #! Select > Secondary subtitle track
g-l         script-binding select/select-subtitle-line      #! Select > Subtitle line
g-h         script-binding select/select-watch-history      #! Select > Watch history
g-w         script-binding select/select-watch-later        #! Select > Watch later
g-b         script-binding select/select-binding            #! Select > Keybinds
g-r         script-binding select/show-properties           #! Select > Properties
g-d         script-binding select/select-audio-device       #! Select > Audio device
g-m         script-binding select/menu                      #! Select > Misc menu

#                                                           #! ---

Ctrl+1      change-list glsl-shaders toggle "~~/shaders/FSR.glsl"                        #! Shaders > FSR
Ctrl+2      change-list glsl-shaders toggle "~~/shaders/FSRCNNX_x2_8-0-4-1.glsl"         #! Shaders > FSRCNNX
Ctrl+3      change-list glsl-shaders toggle "~~/shaders/SSimSuperRes.glsl"; change-list glsl-shaders toggle "~~/shaders/SSimDownscaler.glsl" #! Shaders > SSimSuperRes + SSimDownscaler
Ctrl+4      change-list glsl-shaders toggle "~~/shaders/adaptive-sharpen.glsl"           #! Shaders > Adaptive Sharpen
Ctrl+5      change-list glsl-shaders toggle "~~/shaders/Anime4K/Restore_CNN_S.glsl"      #! Shaders > Anime4K Restore
Ctrl+6      change-list glsl-shaders toggle "~~/shaders/Anime4K/Restore_CNN_Soft_S.glsl" #! Shaders > Anime4K Restore Soft
Ctrl+7      apply-profile anime4k-mode-a; show-text "Anime4K: Mode A (Fast)"             #! Shaders > Anime4K Presets > Mode A
Ctrl+8      apply-profile anime4k-mode-b; show-text "Anime4K: Mode B (Fast)"             #! Shaders > Anime4K Presets > Mode B
Ctrl+9      apply-profile anime4k-mode-c; show-text "Anime4K: Mode C+A (Fast)"           #! Shaders > Anime4K Presets > Mode C+A
Ctrl+0      change-list glsl-shaders toggle "~~/shaders/ArtCNN_C4F8_DS_CMP.glsl"         #! Shaders > ArtCNN DS
Ctrl+`      change-list glsl-shaders clr ""                 #! Shaders > Clear all

F5          script-binding quality_menu/reload              #! Scripts > Reload
t           script-binding seek_to/toggle-seeker            #! Scripts > Seek to
c           script-message-to crop start-crop hard          #! Scripts > Crop > Hard crop
Alt+c       script-message-to crop start-crop soft          #! Scripts > Crop > Soft crop
Ctrl+l      script-message-to crop start-crop delogo        #! Scripts > Crop > Delogo
d           script-message-to crop remove-crop              #! Scripts > Crop > Remove crop
$           script-binding skipsilence/toggle               #! Scripts > SkipSilence > Toggle skipsilence
#           script-binding skipsilence/toggle-arnndn        #! Scripts > SkipSilence > Toggle arnndn
/           script-binding skipsilence/threshold-up         #! Scripts > SkipSilence > Increase silence threshold
\           script-binding skipsilence/threshold-down       #! Scripts > SkipSilence > Decrease silence threshold
%           show-text "${user-data/skipsilence/info}" 3000  #! Scripts > SkipSilence > Info
#           script-binding skipsilence/reset-total          #! Scripts > SkipSilence > Reset total saved time stats
#           apply-profile skipsilence-default               #! Scripts > SkipSilence > Preset: Default
#           apply-profile skipsilence-extreme               #! Scripts > SkipSilence > Preset: Extreme
Ctrl+c      script-binding copyStuff/copyTime               #! Scripts > CopyStuff > Copy time
#           script-binding copyStuff/copyFilename           #! Scripts > CopyStuff > Copy filename
#           script-binding copyStuff/copyFullPath           #! Scripts > CopyStuff > Copy full path
Ctrl+j      script-binding copyStuff/copySubtitle           #! Scripts > CopyStuff > Copy subtitle
#           script-binding copyStuff/copyDuration           #! Scripts > CopyStuff > Copy duration
Ctrl+m      script-binding copyStuff/copyMetadata           #! Scripts > CopyStuff > Copy metadata

Ctrl+O      script-binding uosc/show-in-directory           #! Misc > Open file location
Ctrl+,      script-binding uosc/open-config-directory       #! Misc > Open config directory
#                                                           #! Misc > ---
#           script-binding uosc/delete-file-next            #! Misc > Delete file & Next
#           script-binding uosc/delete-file-prev            #! Misc > Delete file & Prev
