# mpv Keybinds #
WHEEL_UP        add volume  2; script-binding uosc/flash-volume
WHEEL_DOWN      add volume -2; script-binding uosc/flash-volume

BS              set speed     1; script-binding uosc/flash-speed; script-message-to skipsilence adjust-speed set 1
[               add speed -0.25; script-binding uosc/flash-speed; script-message-to skipsilence adjust-speed add -0.25
]               add speed  0.25; script-binding uosc/flash-speed; script-message-to skipsilence adjust-speed add  0.25
Ctrl+[          add speed -0.05
Ctrl+]          add speed  0.05

Alt+0           set window-scale  1.0
Alt+1           add window-scale -0.1
Alt+2           add window-scale  0.1
Alt+`           set geometry 50%:50%; set autofit-larger 90%x90%

PGUP            add chapter  1; script-binding uosc/flash-timeline
PGDWN           add chapter -1; script-binding uosc/flash-timeline
Shift+PGUP      seek  600; script-binding uosc/flash-timeline
Shift+PGDWN     seek -600; script-binding uosc/flash-timeline

B               cycle-values deband-iterations 1 2 3; cycle-values deband-threshold 48 64 96; cycle-values deband-grain 5 16 32; show-text "Deband: ${deband-iterations}:${deband-threshold}:${deband-range}:${deband-grain}"
h               cycle-values hr-seek default yes

p               ignore
p-p             apply-profile PiP
p-ESC           apply-profile PiP restore

# Default seek using arrow keys (5s and 60s)
RIGHT           seek  5
LEFT            seek -5
UP              seek  60; script-binding uosc/flash-timeline
DOWN            seek -60; script-binding uosc/flash-timeline
# Shift enables smaller seek (1s and 30s)
Shift+UP        seek  30; script-binding uosc/flash-timeline
Shift+DOWN      seek -30; script-binding uosc/flash-timeline
# Ctrl enables alternative seek (10s and sub-seek)
Ctrl+RIGHT      seek  10
Ctrl+LEFT       seek -10
Ctrl+UP         sub-seek  1
Ctrl+DOWN       sub-seek -1


# Script Keybinds #
F1          script-binding uosc/items
F2          script-binding uosc/chapters
F3          script-binding uosc/editions
TAB         script-binding uosc/menu
MBTN_MID    script-binding uosc/menu
<           script-binding uosc/prev; script-message-to uosc flash-elements top_bar,timeline
>           script-binding uosc/next; script-message-to uosc flash-elements top_bar,timeline
DEL         script-binding uosc/toggle-ui
Shift+DEL   script-message-to uosc toggle-elements timeline
o           script-binding uosc/flash-timeline
O           script-binding uosc/open-file                   #! Open file
~           script-binding uosc/keybinds                    #! Keybinds Palette

#           set video-aspect-override no                    #! Video > Aspect ratio > Original
#           set video-aspect-override 16:9                  #! Video > Aspect ratio > 16:9
