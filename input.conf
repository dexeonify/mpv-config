#           cycle-values video-rotate 270 180 90 0          #! Video > Rotate > -90° ↺
Ctrl+r      cycle-values video-rotate 90 180 270 0          #! Video > Rotate > +90° ↻
#           cycle-values video-rotate 180 0                 #! Video > Rotate > 180°
#           vf toggle hflip                                 #! Video > Rotate > Flip horizontal
#           vf toggle vflip                                 #! Video > Rotate > Flip vertical
#           set hwdec no                                    #! Video > Hardware decoding > Disabled
#           set hwdec auto                                  #! Video > Hardware decoding > d3d11va (auto)
#           set hwdec auto-copy                             #! Video > Hardware decoding > d3d11va-copy (auto-copy)
#           set hwdec dxva2-copy                            #! Video > Hardware decoding > dxva2-copy
x           apply-profile mid; show-text "Profile: Fast"    #! Video > Profile: Fast
X           apply-profile mid restore; show-text "Profile: Default" #! Video > Profile: Default

