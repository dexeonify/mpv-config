# OSD
osc=no
osd-bar=no
osd-font=Manrope TabNum

# Player
pause=yes
save-position-on-quit=yes
save-watch-history=yes
write-filename-in-watch-later-config=yes

# Window
title-bar=no
snap-window=yes
keep-open=always
autofit-larger=90%x90%

# Video
vo=gpu-next
hwdec=auto
demuxer-max-bytes=300MiB
demuxer-max-back-bytes=200MiB
glsl-shaders="~~/shaders/FSR.glsl"

# Deband
## Debanding settings are divided into 3 modes: light, medium & heavy.
##   Light: 1:48:16:5  |  Medium: 2:64:16:16  |  Heavy: 3:96:16:32
## Light mode is used by default.
## You can cycle through the deband modes with shift+b (see input.conf).
deband-iterations=1    # Higher: Reduce more banding but more GPU usage; >4 is redundant [Default: 1, <1..16>]
deband-threshold=48    # Higher: Increase debanding strength [Default: 48, <0..4096>]
deband-range=16        # Higher: Find more gradients; Lower: Smooth more aggressively [Default: 16, <1..64>]
deband-grain=5         # Higher: Add more noise to cover up banding [Default: 32, <0..4096>]

# Audio
mute=yes
volume=60
af-add=@norm:!dynaudnorm=r=1:b=1
af-add=@skipsilence_silencedetect:!anull

# Subtitles
sub-font=Manrope SemiBold

# Screenshot
## %X is the fallback path for non-local files, like network streams.
## Basically, the template is: "Filename [HH.MM.SS.MS] (%n).png"
screenshot-template="%X{~~desktop/}%F [%wH.%wM.%wS.%wT] (%#01n)"
screenshot-format=jxl
screenshot-jxl-distance=0

# Terminal
msg-color=yes
msg-module=yes
term-osd-bar=yes
term-osd-bar-chars= [-| ]

# Internal scripts
script-opt=console-font=Cascadia Code
script-opt=console-font_size=20
script-opt=console-background_alpha=20
script-opt=stats-font_mono=Cascadia Code
script-opt=stats-show_frame_info=yes
script-opt=commands-persist_history=yes

# Conditional auto profiles
[smooth-osc]
profile-desc=Enable smoother OSC rendering for low framerate videos
profile-cond=container_fps <= 30
video-sync=display-resample

[delete-resume-data]
profile-desc=Do not save watch later config on EOF
profile-cond=eof_reached
profile-restore=copy-equal
save-position-on-quit=no

[background-throttling]
profile-desc=Disable GPU-intensive options when unfocused
profile-cond=not focused and not pause
profile-restore=copy
profile=fast
deband=no
dscale=hermite
correct-downscaling=yes
glsl-shaders-clr

[temp-files]
profile-desc=Avoid saving playback progress and watch history for temporary files
profile-cond=(function() local ignored, path = {"Downloads", "Temp"}, get("path", "") path = ((path:find("^%a[%w.+-]-://") or path:find("^%a[%w.+-]-:%?")) and path:lower() or require "mp.utils".join_path(get("working-directory", ""), path)):sub(1, -get("filename", ""):len()-1):lower() for _, ig in ipairs(ignored) do if path:find(ig:lower(), 1, true) then return true end end end)()
profile-restore=copy-equal
script-opt=memo-enabled=no
save-position-on-quit=no
save-watch-history=no

# Runtime profiles
[mid]
profile-restore=copy
profile=fast

[PiP]
profile-desc=Emulate Picture-in-Picture mode by resizing and moving the window
profile-restore=copy
profile=background-throttling
ontop=yes
show-in-taskbar=no
geometry=-10+10
autofit-larger=50%x50%

[anime4k-mode-a]
profile-desc=Restore -> 2x Upscale
glsl-shaders="~~/shaders/Anime4K/Clamp_Highlights.glsl"
glsl-shader="~~/shaders/Anime4K/Restore_CNN_M.glsl"
glsl-shader="~~/shaders/Anime4K/Upscale_CNN_x2_M.glsl"
glsl-shader="~~/shaders/Anime4K/AutoDownscalePre_x2.glsl"
glsl-shader="~~/shaders/Anime4K/AutoDownscalePre_x4.glsl"
glsl-shader="~~/shaders/Anime4K/Upscale_CNN_x2_S.glsl"

[anime4k-mode-b]
profile-desc=Restore_Soft -> 2x Upscale
glsl-shaders="~~/shaders/Anime4K/Clamp_Highlights.glsl"
glsl-shader="~~/shaders/Anime4K/Restore_CNN_Soft_M.glsl"
glsl-shader="~~/shaders/Anime4K/Upscale_CNN_x2_M.glsl"
glsl-shader="~~/shaders/Anime4K/AutoDownscalePre_x2.glsl"
glsl-shader="~~/shaders/Anime4K/AutoDownscalePre_x4.glsl"
glsl-shader="~~/shaders/Anime4K/Upscale_CNN_x2_S.glsl"

[anime4k-mode-c]
profile-desc=Upscale_Denoise -> Restore -> Upscale
glsl-shaders="~~/shaders/Anime4K/Clamp_Highlights.glsl"
glsl-shader="~~/shaders/Anime4K/Upscale_Denoise_CNN_x2_S.glsl"
glsl-shader="~~/shaders/Anime4K/AutoDownscalePre_x2.glsl"
glsl-shader="~~/shaders/Anime4K/AutoDownscalePre_x4.glsl"
glsl-shader="~~/shaders/Anime4K/Restore_CNN_S.glsl"
glsl-shader="~~/shaders/Anime4K/Upscale_CNN_x2_S.glsl"

[skipsilence-default]
profile-desc=A slightly modified version of skipsilence defaults
script-opt=skipsilence-ramp_constant=1.25
script-opt=skipsilence-ramp_factor=2.5
script-opt=skipsilence-ramp_exponent=1
script-opt=skipsilence-speed_max=4
script-opt=skipsilence-lookahead=0

[skipsilence-extreme]
profile-desc=Very aggressive skipping of silence, can make it hard to listen
script-opt=skipsilence-ramp_constant=2
script-opt=skipsilence-ramp_factor=6
script-opt=skipsilence-ramp_exponent=1.4
script-opt=skipsilence-speed_max=8
script-opt=skipsilence-lookahead=1
